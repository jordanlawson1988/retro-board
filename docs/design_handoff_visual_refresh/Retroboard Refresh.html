<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Retroboard — Refresh</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #0c0d10; }
    body {
      font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    }
    /* Artboards: ensure clean root for theme tokens */
    .artboard-root { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="screen-home.jsx"></script>
  <script type="text/babel" src="screen-dashboard.jsx"></script>
  <script type="text/babel" src="screen-board.jsx"></script>
  <script type="text/babel" src="screen-mobile.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard,
            HomeScreen, DashboardScreen, BoardDesktopScreen, BoardMobileScreen } = window;

    function App() {
      return (
        <DesignCanvas title="Retroboard · Refresh"
                      subtitle="Quiet Modern redesign — original direction, same functionality. Each artboard has its own light/dark toggle.">

          <DCSection id="board" title="Board" subtitle="Where the work happens — desktop grid with columns, voting, action items, timer.">
            <DCArtboard id="board-light" label="Desktop · Light" width={1440} height={900}>
              <div className="artboard-root"><BoardDesktopScreen theme="light" /></div>
            </DCArtboard>
            <DCArtboard id="board-dark" label="Desktop · Dark" width={1440} height={900}>
              <div className="artboard-root"><BoardDesktopScreen theme="dark" /></div>
            </DCArtboard>
          </DCSection>

          <DCSection id="mobile" title="Mobile" subtitle="Single-column snap navigation, large tap targets, bottom-sheet composer.">
            <DCArtboard id="mobile-light" label="iPhone · Light" width={390} height={844}>
              <div className="artboard-root"><BoardMobileScreen theme="light" /></div>
            </DCArtboard>
            <DCArtboard id="mobile-dark" label="iPhone · Dark" width={390} height={844}>
              <div className="artboard-root"><BoardMobileScreen theme="dark" /></div>
            </DCArtboard>
          </DCSection>

          <DCSection id="home" title="Home" subtitle="Landing — create a retro or join one with a code. Modal for template selection.">
            <DCArtboard id="home-light" label="Home · Light" width={1280} height={820}>
              <div className="artboard-root"><HomeScreen theme="light" /></div>
            </DCArtboard>
            <DCArtboard id="home-dark" label="Home · Dark" width={1280} height={820}>
              <div className="artboard-root"><HomeScreen theme="dark" /></div>
            </DCArtboard>
          </DCSection>

          <DCSection id="dashboard" title="Dashboard" subtitle="My boards — filter, search, stats. Each card previews its column tints.">
            <DCArtboard id="dashboard-light" label="Dashboard · Light" width={1280} height={900}>
              <div className="artboard-root"><DashboardScreen theme="light" /></div>
            </DCArtboard>
            <DCArtboard id="dashboard-dark" label="Dashboard · Dark" width={1280} height={900}>
              <div className="artboard-root"><DashboardScreen theme="dark" /></div>
            </DCArtboard>
          </DCSection>

        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
